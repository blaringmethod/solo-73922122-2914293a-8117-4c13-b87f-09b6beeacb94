{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>新建曲目</h2>
  <form method="post" action="{{ url_for('create_tune') }}" class="inline-form">
    <label>曲名 <input name="name" placeholder="例如：小星星"></label>
    <label>纸带格数 <input name="strip_length" type="number" min="1" value="30" required></label>
    <label>同音孔最小间距 <input name="min_spacing" type="number" min="1" max="8" value="2" required></label>
    <button type="submit">创建</button>
  </form>
</section>

<section class="card">
  <h2>曲目列表</h2>
  {% if tunes %}
  <table>
    <tr><th>曲名</th><th>纸带格数</th><th>同音孔距</th><th>音符组数</th><th>已打孔数</th><th></th></tr>
    {% for t in tunes %}
    <tr>
      <td>{{ t.name }}</td>
      <td>{{ t.strip_length }}</td>
      <td>{{ t.min_spacing }}</td>
      <td>{{ t.ngroups }}</td>
      <td>{{ t.npunches }}</td>
      <td><a href="{{ url_for('tune_page', tid=t.id) }}">打开</a></td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="hint">还没有曲目，先创建一个吧。</p>
  {% endif %}
</section>
{% endblock %}
