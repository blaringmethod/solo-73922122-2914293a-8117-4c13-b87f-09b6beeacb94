services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MUSICBOX_DB: /data/musicbox.db
      SEED_DEMO: "1"          # 首次启动写入《小星星》示例；置 0 关闭
      # SECRET_KEY: 请在生产环境设置
    volumes:
      - musicbox-data:/data   # SQLite 数据持久化
    restart: unless-stopped

volumes:
  musicbox-data:
